
[project]
name = "pg-advisor-mcp"
version = "0.1.0"
description = "Autonomous PostgreSQL query optimization and migration safety MCP server"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.1.3",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "sqlglot>=30.24.0",
]

# This tells uv and Python what command to run when executed as a package:
[project.scripts]
pg-advisor = "query_optimiser.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/query_optimiser"]